<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>ASR local acceptance target</title>
<style>
body { max-width: 900px; margin: 30px auto; padding: 0 20px; font: 18px sans-serif; }
textarea { display: block; box-sizing: border-box; width: 100%; min-height: 170px; margin: 12px 0 24px; font: 18px sans-serif; }
</style>
<h1>音声入力の評価用ページ</h1>
<p>このローカルページには送信処理や外部リソースがありません。ランナーの案内に従って空欄を登録してください。</p>
<label for="primary">主な入力先</label>
<textarea id="primary" aria-label="ASR evaluation primary" autocomplete="off" spellcheck="false"></textarea>
<label for="secondary">移動先</label>
<textarea id="secondary" aria-label="ASR evaluation secondary" autocomplete="off" spellcheck="false"></textarea>
</html>
