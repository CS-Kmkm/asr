[project]
name = "asr"
version = "0.1.0"
description = "Persistent local ASR worker (VibeVoice / faster-whisper / mock backends) for Local Voice Input"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
vibevoice = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.46.0",
    "librosa>=0.11.0",
    "torch",
    "torchvision>=0.26.0",
    "transformers>=5.6.2",
]
