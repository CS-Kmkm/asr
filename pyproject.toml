[project]
name = "asr"
version = "0.1.0"
description = "Persistent local ASR worker (VibeVoice / faster-whisper / mock backends) for Local Voice Input"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper>=1.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
vibevoice = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.46.0",
    "librosa>=0.11.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers>=5.6.2",
]
serve = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.18,<1",
    "uvicorn>=0.34,<1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
